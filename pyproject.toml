[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "runreceipt"
version = "0.1.0"
description = "Record Python runs and compare the inputs behind different results."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Vansh-738"}]
classifiers = ["Programming Language :: Python :: 3", "Environment :: Console", "Topic :: Software Development :: Debuggers"]

[project.scripts]
runreceipt = "runreceipt.cli:main"

[project.urls]
Repository = "https://github.com/Vansh-738/runreceipt"
Issues = "https://github.com/Vansh-738/runreceipt/issues"

[project.optional-dependencies]
dev = ["build>=1.4,<2", "ruff>=0.17,<0.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
