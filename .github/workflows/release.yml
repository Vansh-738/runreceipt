name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: python -m unittest discover -s tests -v
      - run: runreceipt
      - run: cp examples/demo-report.html dist/
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum *) > SHA256SUMS
          mv SHA256SUMS dist/
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --notes 'Record Python commands and compare their selected inputs, environment fingerprints, installed packages and outcomes. Includes terminal, JSON and standalone HTML comparisons. Install the wheel with pip or see the README for usage and limits.'
